- name: 6. FFmpegによるフルオート・ミキシング（プロ演出版・音量調整済）
        run: |
          echo "Mixing Audio..."
          # 1. イントロを5秒でカット ＆ 音量を30%に抑制（4秒目から1秒かけてフェードアウト）
          ffmpeg -i intro.mp3 -t 5 -af "volume=0.6,afade=t=out:st=4:d=1" -ar 44100 -ac 2 -c:a libmp3lame -q:a 2 intro_norm.mp3
          
          # 2. アウトロを15秒でカット ＆ 音量を25%に抑制（13秒目から2秒かけてフェードアウト）
          ffmpeg -i outro.mp3 -t 15 -af "volume=0.6,afade=t=out:st=13:d=2" -ar 44100 -ac 2 -c:a libmp3lame -q:a 2 outro_bgm_norm.mp3
          
          # 3. 本編の声＋裏で流すBGM（音量を10%から「5%」に半減）
          ffmpeg -i voice.wav -stream_loop -1 -i bgm.mp3 -filter_complex "[0:a]aresample=44100,aformat=channel_layouts=stereo[v];[1:a]aresample=44100,aformat=channel_layouts=stereo,volume=0.05[b];[v][b]amix=inputs=2:duration=first:dropout_transition=2[out]" -map "[out]" -c:a libmp3lame -q:a 2 mixed_norm.mp3

          # 4. レンの声をフォーマット統一（開始から「2秒後」に再生されるよう遅延させる）
          ffmpeg -i subscribe.wav -filter_complex "adelay=2000|2000,aresample=44100,aformat=channel_layouts=stereo" -c:a libmp3lame -q:a 2 subscribe_norm.mp3
          
          # 5. アウトロBGMとレンの声を合成
          ffmpeg -i outro_bgm_norm.mp3 -i subscribe_norm.mp3 -filter_complex "[0:a][1:a]amix=inputs=2:duration=first:dropout_transition=2[out]" -map "[out]" -c:a libmp3lame -q:a 2 outro_final.mp3
          
          # 6. すべてを結合（イントロ5秒 ＋ 本編 ＋ アウトロ15秒）
          ffmpeg -i intro_norm.mp3 -i mixed_norm.mp3 -i outro_final.mp3 -filter_complex "[0:a][1:a][2:a]concat=n=3:v=0:a=1[outa]" -map "[outa]" -c:a libmp3lame -q:a 2 final_episode.mp3
