name: Daily Podcast Automator

on:
  schedule:
    - cron: '0 21 * * 0-4'
  workflow_dispatch:

jobs:
  build-and-mix:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 音声編集エンジン（FFmpeg等）の準備
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq

      - name: 2. ニュース取得（fetch-news）の実行
        run: |
          echo "Fetching today's news..."
          curl -s -X POST "${{ secrets.EDGE_FUNCTION_BASE_URL }}/fetch-news" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          sleep 10

      - name: 3. 台本・音声生成（generate-script）の実行
        run: |
          echo "Generating script and voice..."
          curl -s -X POST "${{ secrets.EDGE_FUNCTION_BASE_URL }}/generate-script" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

      - name: 4. 最新データのメタ情報（BGM指示など）を取得
        id: meta
        run: |
          echo "Supabaseから最新エピソードの情報を取得しています..."
          
          LATEST=$(curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/podcast_scripts?select=id,bgm_mood,audio_url&status=eq.completed&order=created_at.desc&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}")

          if [[ "$LATEST" == *"message"* ]] || [[ "$LATEST" == *"error"* ]] || [[ "$LATEST" == "[]" ]]; then
            echo "❌ 【エラー】Supabaseからデータの取得を拒否されました。"
            exit 1
          fi

          SCRIPT_ID=$(echo "$LATEST" | jq -r '.[0].id')
          BGM_MOOD=$(echo "$LATEST" | jq -r '.[0].bgm_mood')
          VOICE_URL=$(echo "$LATEST" | jq -r '.[0].audio_url')

          if [[ "$VOICE_URL" == "null" || -z "$VOICE_URL" ]]; then
            echo "❌ 【エラー】URLがnullです。"
            exit 1
          fi

          if [[ ! "$BGM_MOOD" =~ ^(calm|serious|tension|intro_theme)$ ]]; then
            BGM_MOOD="intro_theme"
          fi

          echo "SCRIPT_ID=$SCRIPT_ID" >> "$GITHUB_ENV"
          echo "BGM_MOOD=$BGM_MOOD" >> "$GITHUB_ENV"
          echo "VOICE_URL=$VOICE_URL" >> "$GITHUB_ENV"

      - name: 5. 音声素材（声・BGM・チャンネル登録ボイス）のダウンロード
        run: |
          echo "音声ファイル（$VOICE_URL）をダウンロード中..."
          curl -s -o voice.wav "${{ env.VOICE_URL }}"
          
          DOWNLOAD_URL="${{ secrets.SUPABASE_URL }}/storage/v1/object/public/podcast-audio/bgm"
          curl -s -o intro.mp3 "$DOWNLOAD_URL/intro_theme.mp3"
          curl -s -o outro.mp3 "$DOWNLOAD_URL/outro.mp3"
          curl -s -o bgm.mp3 "$DOWNLOAD_URL/${{ env.BGM_MOOD }}.mp3"
          curl -s -o subscribe.wav "$DOWNLOAD_URL/subscribe.wav"

      - name: 6. FFmpegによるフルオート・ミキシング（プロ演出版・大吾さん指定音量版）
        run: |
          echo "Mixing Audio..."
          # 1. イントロを5秒でカット ＆ 音量を30%に調整（4秒目から1秒かけてフェードアウト）
          ffmpeg -i intro.mp3 -t 5 -af "volume=0.3,afade=t=out:st=4:d=1" -ar 44100 -ac 2 -c:a libmp3lame -q:a 2 intro_norm.mp3
          
          # 2. アウトロを15秒でカット ＆ 音量を50%に調整（13秒目から2秒かけてフェードアウト）
          ffmpeg -i outro.mp3 -t 15 -af "volume=0.5,afade=t=out:st=13:d=2" -ar 44100 -ac 2 -c:a libmp3lame -q:a 2 outro_bgm_norm.mp3
          
          # 3. 本編の声＋裏で流すBGM（声を引き立てるため5%にキープ）
          ffmpeg -i voice.wav -stream_loop -1 -i bgm.mp3 -filter_complex "[0:a]aresample=44100,aformat=channel_layouts=stereo[v];[1:a]aresample=44100,aformat=channel_layouts=stereo,volume=0.05[b];[v][b]amix=inputs=2:duration=first:dropout_transition=2[out]" -map "[out]" -c:a libmp3lame -q:a 2 mixed_norm.mp3

          # 4. レンの声をフォーマット統一（開始から「2秒後」に再生されるよう遅延させる）
          ffmpeg -i subscribe.wav -filter_complex "adelay=2000|2000,aresample=44100,aformat=channel_layouts=stereo" -c:a libmp3lame -q:a 2 subscribe_norm.mp3
          
          # 5. アウトロBGMとレンの声を合成
          ffmpeg -i outro_bgm_norm.mp3 -i subscribe_norm.mp3 -filter_complex "[0:a][1:a]amix=inputs=2:duration=first:dropout_transition=2[out]" -map "[out]" -c:a libmp3lame -q:a 2 outro_final.mp3
          
          # 6. すべてを結合（イントロ5秒 ＋ 本編 ＋ アウトロ15秒）
          ffmpeg -i intro_norm.mp3 -i mixed_norm.mp3 -i outro_final.mp3 -filter_complex "[0:a][1:a][2:a]concat=n=3:v=0:a=1[outa]" -map "[outa]" -c:a libmp3lame -q:a 2 final_episode.mp3

      - name: 7. 完成した最終エピソードをSupabaseへ保存
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/storage/v1/object/podcast-audio/Podcast/final_${{ env.SCRIPT_ID }}.mp3" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: audio/mpeg" \
            --data-binary @final_episode.mp3

      - name: 8. Discordへ「完成通知」を送信
        run: |
          FINAL_URL="${{ secrets.SUPABASE_URL }}/storage/v1/object/public/podcast-audio/Podcast/final_${{ env.SCRIPT_ID }}.mp3"
          cat << EOF > payload.json
          {
            "content": "🎧 **BGMミックス完了！**\\nイントロ・BGM・アウトロの合成が完了し、本日の最終エピソードが書き出されました。\\n▶️ **完成版を聴く:**\\n${FINAL_URL}"
          }
          EOF
          curl -s -H "Content-Type: application/json" -d @payload.json "${{ secrets.DISCORD_WEBHOOK_URL }}"
